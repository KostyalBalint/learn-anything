name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installed here (not left to the action) so Chromium can be fetched with the
      # exact Playwright version from the lockfile, before the build runs.
      - run: npm ci

      # Mermaid diagrams are rendered to SVG at build time by a headless browser.
      - name: Install Chromium for Mermaid
        run: npx playwright install --with-deps chromium

      # Runs `astro build`, which also writes the Pagefind index into dist/pagefind/,
      # then uploads dist/ as the Pages artifact. No separate pagefind step needed.
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
